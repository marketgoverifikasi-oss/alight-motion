<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alight Motion Premium · Barikz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #08080c;
    --surface: #0f0f17;
    --surface-2: #15151f;
    --surface-3: #1b1b28;
    --border: #23232f;
    --border-light: #2e2e3d;
    --text: #ececf4;
    --muted: #8585a0;
    --muted-2: #5e5e75;
    --accent: #8b5cf6;
    --accent-2: #06b6d4;
    --accent-glow: rgba(139, 92, 246, 0.35);
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --radius: 14px;
    --radius-sm: 10px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
}

html, body { height: 100%; }

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.12), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(6, 182, 212, 0.10), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.04), transparent 60%);
    pointer-events: none;
    z-index: 0;
}

/* LOADER */
.loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #06060a;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}
.loader.hide { opacity: 0; visibility: hidden; }
.loader-content {
    display: flex; flex-direction: column; align-items: center;
    gap: 22px; animation: loaderIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes loaderIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.loader-rings {
    position: relative; width: 130px; height: 130px;
    display: flex; align-items: center; justify-content: center;
}
.loader-rings .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-right-color: var(--accent-2);
    animation: spin 1.4s linear infinite;
}
.loader-rings .ring:nth-child(2) {
    inset: 14px; border-top-color: var(--accent-2);
    border-right-color: var(--accent);
    animation-duration: 2s; animation-direction: reverse;
}
.loader-rings .ring:nth-child(3) {
    inset: 28px; border-top-color: rgba(139, 92, 246, 0.5);
    border-right-color: transparent; animation-duration: 1s;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-logo {
    font-family: var(--mono); font-weight: 700; font-size: 26px;
    background: linear-gradient(135deg, #a78bfa, #06b6d4);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px; animation: pulseLogo 2s ease-in-out infinite; z-index: 2;
}
@keyframes pulseLogo {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
}
.loader-title {
    font-size: 20px; font-weight: 800; letter-spacing: 4px;
    color: var(--text); animation: fadeUp 0.6s 0.2s backwards;
}
.loader-sub {
    font-size: 12px; letter-spacing: 3px; color: var(--muted);
    text-transform: uppercase; margin-top: -14px;
    animation: fadeUp 0.6s 0.35s backwards;
}
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.loader-bar {
    width: 220px; height: 3px; background: rgba(255, 255, 255, 0.08);
    border-radius: 99px; overflow: hidden; position: relative;
    animation: fadeUp 0.6s 0.5s backwards;
}
.loader-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 99px; transition: width 0.4s ease;
    box-shadow: 0 0 12px var(--accent-glow);
}
.loader-status {
    font-family: var(--mono); font-size: 11px; color: var(--muted-2);
    letter-spacing: 0.5px; animation: fadeUp 0.6s 0.65s backwards;
}

/* TOPBAR */
.topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 10, 15, 0.78);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}
.topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
}
.brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap;
}
.brand-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
    animation: dotPulse 2s infinite; flex-shrink: 0;
}
@keyframes dotPulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
    70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.brand b {
    background: linear-gradient(135deg, #a78bfa, #06b6d4);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}
.stats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stat {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; padding: 5px 12px; font-size: 11px;
}
.stat-label { color: var(--muted-2); font-weight: 500; letter-spacing: 0.3px; }
.stat-value {
    font-family: var(--mono); font-weight: 700; color: var(--text);
    font-size: 11.5px; letter-spacing: 0.3px; min-width: 58px; text-align: center;
}
.stat-value.live { color: #4ade80; }
.stat-value.time { color: #22d3ee; }
.stat-value.date { color: #a78bfa; }

/* LAYOUT */
.wrap {
    max-width: 780px; margin: 0 auto; padding: 40px 20px 80px;
    position: relative; z-index: 1;
}

/* HERO */
.hero { text-align: center; margin-bottom: 36px; animation: fadeUp 0.6s 0.1s backwards; }
.hero h1 {
    font-size: clamp(28px, 6vw, 42px); font-weight: 800;
    letter-spacing: -0.8px; line-height: 1.15; margin-bottom: 12px;
}
.hero h1 .grad {
    background: linear-gradient(135deg, #a78bfa 0%, #06b6d4 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hero p { color: var(--muted); font-size: 14.5px; max-width: 460px; margin: 0 auto; }
.hero .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.25);
    color: #c4b5fd; font-size: 11px; font-weight: 600;
    padding: 5px 12px; border-radius: 99px; margin-bottom: 16px;
    letter-spacing: 0.4px; text-transform: uppercase;
}

/* MODE SWITCH */
.mode-switch {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; padding: 5px; margin-bottom: 26px;
    animation: fadeUp 0.6s 0.2s backwards;
}
.mode-slider {
    position: absolute; top: 5px; left: 5px;
    width: calc(50% - 5px); height: calc(100% - 10px);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 99px;
    transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);
    box-shadow: 0 4px 16px var(--accent-glow);
}
.mode-slider.right { transform: translateX(100%); }
.mode-btn {
    position: relative; z-index: 2; background: none; border: none;
    color: var(--muted); font-family: var(--font);
    font-size: 13.5px; font-weight: 600; padding: 11px 8px;
    border-radius: 99px; cursor: pointer;
    transition: color 0.3s ease;
    display: flex; align-items: center; justify-content: center; gap: 7px;
}
.mode-btn.active { color: #fff; }
.mode-btn svg { width: 15px; height: 15px; }

/* PANELS */
.panel { display: none; animation: fadeUp 0.45s ease; }
.panel.active { display: block; }
.card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 26px 24px;
    position: relative; overflow: hidden;
}
.card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.5), transparent);
}

/* STEPS */
.steps {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 28px;
}
.step {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    background: var(--surface-3); border: 1px solid var(--border);
    color: var(--muted-2); transition: all 0.3s ease; flex-shrink: 0;
}
.step.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
    box-shadow: 0 0 14px var(--accent-glow);
}
.step.done {
    background: rgba(34, 197, 94, 0.15);
    border-color: rgba(34, 197, 94, 0.4); color: var(--success);
}
.step-line { width: 42px; height: 1px; background: var(--border); transition: background 0.3s ease; }
.step-line.done { background: rgba(34, 197, 94, 0.4); }
.step-content { display: none; animation: fadeUp 0.4s ease; }
.step-content.active { display: block; }
.step-content h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.2px; }
.step-content > p { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }

/* FORM */
.field { margin-bottom: 16px; }
.field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); margin-bottom: 7px; letter-spacing: 0.3px;
}
input[type="text"], input[type="email"] {
    width: 100%; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 13px 15px; color: var(--text);
    font-family: var(--font); font-size: 14px; outline: none;
    transition: all 0.2s ease;
}
input::placeholder { color: var(--muted-2); }
input:focus {
    border-color: var(--accent); background: var(--surface-3);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
}

/* BUTTONS */
.btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: var(--radius-sm);
    padding: 13px 18px; color: #fff;
    font-family: var(--font); font-size: 14px; font-weight: 700;
    letter-spacing: 0.2px; cursor: pointer;
    transition: all 0.25s ease;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    position: relative; overflow: hidden;
}
.btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px var(--accent-glow);
}
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-ghost {
    width: 100%; background: transparent;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 18px; color: var(--muted);
    font-family: var(--font); font-size: 13px; font-weight: 600;
    cursor: pointer; margin-top: 9px; transition: all 0.2s ease;
}
.btn-ghost:hover { border-color: var(--border-light); color: var(--text); background: var(--surface-2); }
.spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: none;
}
.btn-primary.loading .spinner { display: block; }
.btn-primary.loading .btn-text { opacity: 0.85; }

/* BULK QTY */
.qty-label {
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.3px; margin-bottom: 10px; display: block;
}
.qty-buttons {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 8px; margin-bottom: 22px;
}
.qty-btn {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 4px;
    color: var(--muted); font-family: var(--mono);
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.2s ease; position: relative;
}
.qty-btn:hover:not(:disabled) {
    border-color: var(--border-light); color: var(--text); background: var(--surface-3);
}
.qty-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
    box-shadow: 0 4px 16px var(--accent-glow); transform: translateY(-1px);
}
.qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.qty-note {
    font-size: 11.5px; color: var(--muted-2);
    text-align: center; margin-top: -12px; margin-bottom: 20px;
}
.qty-note b { color: var(--warning); }

/* PROGRESS */
.bulk-progress {
    display: none; margin-top: 20px; padding: 18px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
}
.bulk-progress.show { display: block; animation: fadeUp 0.3s ease; }
.progress-head {
    display: flex; justify-content: space-between; align-items: center
